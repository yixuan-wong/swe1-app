language: python
dist: noble
python:
  - "3.14"
env:
  - COVERALLS_SERVICE_NAME=travis-pro
install:
  - python -m pip install -r requirements.txt
  - python -m pip install black flake8 coverage coveralls
script:
  - black --check mysite polls manage.py create_superuser.py
  - flake8 mysite polls manage.py create_superuser.py
  - coverage run --source=mysite,polls manage.py test
  - coverage report
after_script:
  - coveralls
deploy:
  provider: elasticbeanstalk
  app: djangotutorial
  env: swe1-app-env
  region: us-east-1
  bucket: elasticbeanstalk-us-east-1-197716153134
  edge: true
  wait_until_deployed: true
  "on":
    branch: main
